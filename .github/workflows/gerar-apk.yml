
name: Gerar APK Inventario de Capas

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar projeto Android
        run: |
          echo "Arquivos encontrados:"
          ls -la
          ls -la InventarioCapasAndroid
          ls -la InventarioCapasAndroid/app

      - name: Gerar APK
        working-directory: InventarioCapasAndroid
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Capas-Dexco-APK
          path: InventarioCapasAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
